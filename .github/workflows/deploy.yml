name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout code
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10

      - name: 📦 Install Dependencies
        run: pnpm install

      - name: 🏗️ Build Next.js
        run: pnpm build
        env:
          DATABASE_URL: "postgresql://postgres.ybksxjejwberpzhrawzy:YtKCGNxx7OMyKMjn@aws-0-ap-southeast-2.pooler.supabase.com:6543/postgres?pgbouncer=true"

      - name: 🗜️ Compress Build Files
        run: tar -czf deploy.tar.gz .next public src package.json pnpm-lock.yaml pnpm-workspace.yaml prisma next.config.ts next-sitemap.config.js ecosystem.config.js .npmrc tsconfig.json postcss.config.mjs prisma.config.ts

      - name: 📤 Upload Build to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          source: "deploy.tar.gz"
          target: "/var/www/juragan-transport"

      - name: 🚀 Deploy & Restart PM2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            cd /var/www/juragan-transport
            
            # Ekstrak file build
            tar -xzf deploy.tar.gz
            rm deploy.tar.gz
            
            # Install modul untuk production & generate prisma
            npm install -g pnpm
            pnpm install --ignore-scripts || pnpm install
            pnpm postbuild || echo "postbuild skipped"
            
            # Restart PM2 dengan ecosystem.config.js
            pm2 restart ecosystem.config.js --update-env || pm2 start ecosystem.config.js
            pm2 save
